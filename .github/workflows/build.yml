name: Compile ESP32-C3 factory firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FOSS build tools
        run: python -m pip install 'platformio==6.2.0' 'esptool==4.11.0'
      - name: Run source regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Arduino/ESP32-C3 firmware
        run: pio run -e esp32c3
      - name: Make flash-from-Android factory binary (offset 0x0)
        run: python scripts/make_factory.py
      - name: Upload flashable firmware and component binaries
        uses: actions/upload-artifact@v4
        with:
          name: temperature-logger-esp32c3
          if-no-files-found: error
          path: |
            dist/*.bin
            dist/SHA256SUMS.txt
          retention-days: 30
